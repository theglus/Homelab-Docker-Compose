services:
  broker:
    container_name: paperless-broker
    image: docker.io/valkey/valkey:9-alpine
    volumes:
      - /home/jeffrey/docker/paperless/appdata/redis:/data
    restart: unless-stopped

  db:
    container_name: paperless-db
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /home/jeffrey/docker/paperless/appdata/postgres:/var/lib/postgresql
    restart: unless-stopped
      
  webserver:
    container_name: paperless-webserver
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    depends_on:
      - db
      - broker
    ports:
      - "${LOCAL_IP}:8000:8000"
    env_file: /home/jeffrey/docker/paperless/.env
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBPASS: ${POSTGRES_PASSWORD}
      PAPERLESS_CONSUMER_POLLING_INTERVAL: 10
      PAPERLESS_CONSUMER_STABILITY_DELAY: 5
    volumes:
      - /home/jeffrey/docker/paperless/appdata/paperless:/usr/src/paperless/data
      - /mnt/paperless/media:/usr/src/paperless/media
      - /mnt/paperless/consume:/usr/src/paperless/consume
      - /mnt/Backups/Paperless:/usr/src/paperless/export
    restart: unless-stopped

  cloudflared:  
    container_name: cloudflared-paperless
    image: cloudflare/cloudflared     
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARED_TUNNEL_PAPERLESS}
    mem_limit: 1g
    restart: unless-stopped