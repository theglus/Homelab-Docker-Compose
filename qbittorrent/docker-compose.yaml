services:  
  qbittorrent:
    container_name: qbittorrent
    image: lscr.io/linuxserver/qbittorrent:latest
    environment:
      - PUID=1000
      - PGID=999
      - TZ=America/Los_Angeles
      - WEBUI_PORT=10095
    network_mode: "service:gluetun"
    volumes:
      - /home/jeffrey/docker/qbittorrent/appdata:/config
      - /mnt/media:/media
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:10095/ >/dev/null || exit 1"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    depends_on:
      - gluetun

  gluetun:
    container_name: expressvpn
    image: qmcgaw/gluetun:v3.41.1
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=openvpn
      - OPENVPN_CUSTOM_CONFIG=/gluetun/custom/expressvpn.ovpn
      - OPENVPN_USER=${VPN_USERNAME}
      - OPENVPN_PASSWORD=${VPN_PASSWORD}
      - HEALTH_SMALL_CHECK_TYPE=dns
      - OPENVPN_VERSION=2.5
      - FIREWALL_OUTBOUND_SUBNETS=192.168.86.0/24
    network_mode: bridge
    volumes:
      - /home/jeffrey/docker/qbittorrent/appdata/gluetun:/gluetun
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      # Peer traffic
      - "6881:6881"
      - "6881:6881/udp"
      # qBittorrent WebUI
      - "${LOCAL_IP}:10095:10095"
      - "${TAILSCALE_IP}:10095:10095"
      # Jackett
      - "${LOCAL_IP}:9117:9117"
      - "${TAILSCALE_IP}:9117:9117"
      # Sonarr
      - "${LOCAL_IP}:8989:8989"
      - "${TAILSCALE_IP}:8989:8989"
      # Radarr
      - "${LOCAL_IP}:7878:7878"
      - "${TAILSCALE_IP}:7878:7878"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped

  radarr:
    container_name: radarr
    image: lscr.io/linuxserver/radarr:latest
    environment:
      - PUID=1000
      - PGID=999
      - TZ=America/Los_Angeles
    network_mode: service:gluetun
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /home/jeffrey/docker/qbittorrent/appdata/radarr:/config
      - /mnt/media:/media
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7878/ >/dev/null || exit 1"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    depends_on:
      - jackett
      - qbittorrent

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=999
      - TZ=America/Los_Angeles
    network_mode: service:gluetun
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /home/jeffrey/docker/qbittorrent/appdata/sonarr:/config
      - /mnt/media:/media
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8989/ >/dev/null || exit 1"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    depends_on:
      - jackett
      - qbittorrent

  jackett:
    container_name: jackett
    image: lscr.io/linuxserver/jackett:latest
    environment:
      - PUID=1000
      - PGID=999
      - TZ=America/Los_Angeles
    network_mode: service:gluetun
    volumes:
      - /home/jeffrey/docker/qbittorrent/appdata:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9117/ >/dev/null || exit 1"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped